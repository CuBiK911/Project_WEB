        <main id="main">
            <section class="section-padding container account-page">
                <h1>Account</h1>
                <div class="panel">
                    <div class="account-tabs" aria-label="Account options">
                        <a id="login-tab" class="btn btn-quiet" href="#login">Log in</a
                        ><a id="register-tab" class="btn btn-quiet" href="#register">Register</a>
                    </div>
                    <form id="login-form" novalidate>
                        <h2>Log in</h2>
                        <div class="field">
                            <label for="login-email">Email address</label
                            ><input
                                class="form-control"
                                id="login-email"
                                name="login-email"
                                type="email"
                                autocomplete="username"
                                required
                                aria-describedby="login-email-error"
                            />
                            <p class="field-error" id="login-email-error"></p>
                        </div>
                        <div class="field">
                            <label for="login-password">Password</label
                            ><input
                                class="form-control"
                                id="login-password"
                                name="login-password"
                                type="password"
                                autocomplete="current-password"
                                required
                                aria-describedby="login-password-error"
                            />
                            <p class="field-error" id="login-password-error"></p>
                        </div>
                        <button class="btn btn-accent w-100" type="submit">Log in</button>
                        <p id="login-status" class="status" role="status"></p>
                    </form>
                    <form id="register-form" novalidate hidden>
                        <h2>Register</h2>
                        <div class="field">
                            <label for="register-name">Display name</label
                            ><input
                                class="form-control"
                                id="register-name"
                                name="register-name"
                                type="text"
                                autocomplete="nickname"
                                maxlength="40"
                                required
                                aria-describedby="register-name-error"
                            />
                            <p class="field-error" id="register-name-error"></p>
                        </div>
                        <div class="field">
                            <label for="register-email">Email address</label
                            ><input
                                class="form-control"
                                id="register-email"
                                name="register-email"
                                type="email"
                                autocomplete="username"
                                maxlength="120"
                                required
                                aria-describedby="register-email-error"
                            />
                            <p class="field-error" id="register-email-error"></p>
                        </div>
                        <div class="field">
                            <label for="register-password">Password (at least 8 characters)</label
                            ><input
                                class="form-control"
                                id="register-password"
                                name="register-password"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                                aria-describedby="register-password-error"
                            />
                            <p class="field-error" id="register-password-error"></p>
                        </div>
                        <div class="field">
                            <label for="register-confirm">Confirm password</label
                            ><input
                                class="form-control"
                                id="register-confirm"
                                name="register-confirm"
                                type="password"
                                autocomplete="new-password"
                                required
                                aria-describedby="register-confirm-error"
                            />
                            <p class="field-error" id="register-confirm-error"></p>
                        </div>
                        <div class="field">
                            <label class="checkbox-label"
                                ><input
                                    id="register-terms"
                                    type="checkbox"
                                    required
                                    aria-describedby="register-terms-error"
                                />
                                I accept the
                                <a href="policy.html">policy</a>.</label
                            >
                            <p class="field-error" id="register-terms-error"></p>
                        </div>
                        <button class="btn btn-accent w-100" type="submit">Create account</button>
                        <p id="register-status" class="status" role="status"></p>
                    </form>
                </div>
            </section>
